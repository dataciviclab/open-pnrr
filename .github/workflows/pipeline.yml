name: Pipeline

on:
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      years:
        description: "Anni (es. 2026 o all)"
        required: false
        default: ""

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    uses: dataciviclab/.github/.github/workflows/pipeline-reusable.yml@main
    with:
      repo-slug: "open-pnrr"
      run-command: "make run-all"
      # Il server AEM/Akamai blocca i runner: HttpClient ritenta e all'ultimo
      # tentativo ripiega sul proxy se BLOCKED_SOURCE_PROXY è configurato.
      extra-env: "BLOCKED_SOURCE_PROXY=${{ vars.BLOCKED_SOURCE_PROXY }}"
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets: inherit
