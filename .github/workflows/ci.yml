name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extras: "pipeline"

      - name: Preflight all datasets
        run: |
          for f in $(find datasets -name dataset.yml | sort); do
            echo "→ $f"
            toolkit run preflight --config "$f"
          done

  validate:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extras: "pipeline"

      - name: Validate all datasets
        run: |
          for f in $(find datasets -name dataset.yml | sort); do
            echo "→ $f"
            toolkit validate --config "$f"
          done
