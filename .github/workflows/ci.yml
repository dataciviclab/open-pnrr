name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main

      - name: Preflight all datasets
        run: |
          for f in $(find datasets -name dataset.yml | sort); do
            echo "→ $f"
            toolkit run preflight --config "$f"
          done
