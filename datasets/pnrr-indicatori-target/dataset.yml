# PNRR Indicatori Target — Italia Domani
# Fonte: MEF Italia Domani (ReGiS)
# Download via `http_file` (toolkit): UA browser; in CI fallback proxy
# BLOCKED_SOURCE_PROXY per il filtro AEM/Akamai.
root: "../../out"
schema_version: 1

dataset:
  name: "pnrr_indicatori_target"
  source_id: "italiadomani"
  tags: [finanza-pubblica, pnrr, indicatori, target]
  category: finanza-pubblica
  years: [2026]
  time_coverage:
    start_year: 2021
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    - name: pnrr_indicatori_target
      type: http_file
      client:
        timeout: 600
        retries: 2
        user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
      args:
        url: "https://www.italiadomani.gov.it/content/dam/sogei-ng/opendata/PNRR_Indicatori_Target.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  read:
    source: auto
    mode: latest
    delim: ";"
    encoding: "utf-8"
    header: true
    decimal: ","
    sample_size: -1
  required_columns:
    - codice_univoco_submisura
    - descrizione_submisura
    - cup
    - codice_locale_progetto
    - codice_indicatore
    - descrizione_indicatore
    - unita_misura
    - descrizione_unita_misura
    - descrizione_tipo_indicatore
    - valore_realizzato
    - valore_programmato
    - mese
    - anno
    - data_estrazione
  sql: "sql/clean.sql"
  validate:
    min_rows: 200000
    not_null:
      - cup
      - codice_indicatore
    # primary_key: deroga — un CUP può avere più righe (più indicatori, più periodi)

mart:
  tables:
    - name: "mart_avanzamento"
      sql: "sql/mart_avanzamento.sql"
    - name: "mart_per_submisura"
      sql: "sql/mart_per_submisura.sql"
  required_tables:
    - mart_avanzamento
  validate:
    table_rules:
      mart_avanzamento:
        required_columns: [codice_indicatore, descrizione_indicatore, n_cup, n_valori_realizzati, valore_realizzato_totale, valore_programmato_totale, pct_realizzazione]
        primary_key: [codice_indicatore]
        min_rows: 50
      mart_per_submisura:
        required_columns: [codice_univoco_submisura, descrizione_submisura, n_indicatori, n_cup, pct_realizzazione_medio]
        primary_key: [codice_univoco_submisura]
        min_rows: 50

validation:
  fail_on_error: true
