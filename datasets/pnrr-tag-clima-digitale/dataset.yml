# PNRR TAG Sostegno Clima/Digitale — Italia Domani
# Fonte: MEF Italia Domani
# Download via preprocess.py (wget + fallback urllib): server AEM/Akamai
# blocca python-requests ma accetta wget.
# Per CI serve TOOLKIT_ALLOW_SCRIPT_SOURCE=1.
root: "../../out"
schema_version: 1

dataset:
  name: "pnrr_tag_clima_digitale"
  source_id: "italiadomani"
  tags: [finanza-pubblica, pnrr, clima, digitale, tag]
  category: finanza-pubblica
  years: [2026]
  time_coverage:
    start_year: 2021
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    - name: pnrr_tag_clima_digitale
      type: script
      args:
        command: "python preprocess.py raw_input.csv"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  read:
    source: auto
    mode: latest
    delim: ";"
    encoding: "utf-8"
    header: true
    decimal: ","
    sample_size: -1
  required_columns:
    - descrizione_misura
    - id_submisura
    - codice_cid
    - codice_univoco_submisura
    - descrizione_submisura
    - tipo_intervento
    - investimento_riforma
    - sovvenzione_prestito
    - amministrazione_titolare
    - importo_campo_intervento
    - campo_intervento_clima
    - coeff_clima
    - campo_intervento_digitale
    - coeff_digitale
    - importo_clima
    - importo_digitale
  sql: "sql/clean.sql"
  validate:
    min_rows: 200
    not_null:
      - codice_univoco_submisura
    # primary_key: deroga — stessa submisura compare con campi clima/digital diversi (es. multi-coefficiente)

mart:
  tables:
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
  required_tables:
    - mart_sintesi
  validate:
    table_rules:
      mart_sintesi:
        required_columns: [n_submisure, tot_importo, tot_clima, tot_digitale, pct_clima, pct_digitale]
        primary_key: []
        min_rows: 1

validation:
  fail_on_error: true
