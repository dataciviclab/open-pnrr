# PNRR Avanzamento Indicatori Comuni Europei — Italia Domani
# Fonte: MEF Italia Domani
# Download via `http_file` (toolkit): UA browser; in CI fallback proxy
# BLOCKED_SOURCE_PROXY per il filtro AEM/Akamai.
root: "../../out"
schema_version: 1

dataset:
  name: "pnrr_avanzamento_indicatori"
  source_id: "italiadomani"
  tags: [finanza-pubblica, pnrr, indicatori, milestones, target]
  category: finanza-pubblica
  years: [2026]
  time_coverage:
    start_year: 2021
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    - name: pnrr_avanzamento_indicatori
      type: http_file
      client:
        timeout: 300
        retries: 2
        user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
      args:
        url: "https://www.italiadomani.gov.it/content/dam/sogei-ng/opendata/OpenData_PNRR_avanzamento_indicatori_comuni.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  read:
    source: auto
    mode: latest
    delim: ";"
    encoding: "utf-8"
    header: true
    sample_size: -1
  required_columns:
    - missione
    - descrizione_missione
    - componente
    - descrizione_componente
    - id_misura
    - codice_univoco_misura
    - descrizione_misura
    - codice_univoco_submisura
    - id_submisura
    - codice_cid
    - descrizione_submisura
    - amministrazione
    - codice_indicatore
    - descrizione_indicatore
    - unita_misura
    - anno
    - semestre
    - valore_indicatore
    - valore_stimato
    - valore_non_disponibile
    - data_estrazione
    - anno_estrazione
  sql: "sql/clean.sql"
  validate:
    min_rows: 3000
    not_null:
      - codice_indicatore
      - missione

mart:
  tables:
    - name: "mart_per_missione"
      sql: "sql/mart_per_missione.sql"
    - name: "mart_per_submisura"
      sql: "sql/mart_per_submisura.sql"
  required_tables:
    - mart_per_missione
  validate:
    table_rules:
      mart_per_missione:
        required_columns: [missione, descrizione_missione, n_indicatori, n_con_valore, n_non_disponibile, pct_realizzazione]
        primary_key: [missione]
        min_rows: 5
      mart_per_submisura:
        required_columns: [codice_univoco_submisura, descrizione_submisura, n_indicatori, n_con_valore, pct_realizzazione]
        primary_key: [codice_univoco_submisura]
        min_rows: 50

validation:
  fail_on_error: true
