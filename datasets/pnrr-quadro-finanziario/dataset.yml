# PNRR Quadro Finanziario — Italia Domani
# Fonte: MEF Italia Domani
# Download via `http_file` (toolkit): UA browser; in CI fallback proxy
# BLOCKED_SOURCE_PROXY per il filtro AEM/Akamai.
root: "../../out"
schema_version: 1

dataset:
  name: "pnrr_quadro_finanziario"
  source_id: "italiadomani"
  tags: [finanza-pubblica, pnrr, programmazione, misure]
  category: finanza-pubblica
  years: [2026]
  time_coverage:
    start_year: 2021
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    - name: pnrr_quadro_finanziario
      type: http_file
      client:
        timeout: 300
        retries: 2
        user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
      args:
        url: "https://www.italiadomani.gov.it/content/dam/sogei-ng/opendata/OpenData_PNRR_QuadroFinProgrammazione.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  read:
    source: auto
    mode: latest
    delim: ";"
    encoding: "utf-8"
    header: true
    decimal: ","
    sample_size: -1
  required_columns:
    - programma
    - missione
    - descrizione_missione
    - componente
    - descrizione_componente
    - id_misura
    - codice_univoco_misura
    - descrizione_misura
    - id_submisura
    - codice_cid
    - codice_univoco_submisura
    - descrizione_submisura
    - tipo_livello
    - investimento_riforma
    - prestito_sovvenzione
    - amministrazione_titolare
    - importo_totale
    - importo_progetti_in_essere
    - importo_progetti_nuovi
  sql: "sql/clean.sql"
  validate:
    min_rows: 200
    not_null:
      - codice_univoco_submisura
    primary_key: [codice_univoco_submisura]

mart:
  tables:
    - name: "mart_per_missione"
      sql: "sql/mart_per_missione.sql"
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
  required_tables:
    - mart_per_missione
  validate:
    table_rules:
      mart_per_missione:
        required_columns: [missione, descrizione_missione, n_submisure, importo_totale, importo_progetti_in_essere, importo_progetti_nuovi]
        primary_key: [missione]
        min_rows: 5
      mart_sintesi:
        required_columns: [n_submisure, importo_totale, importo_progetti_in_essere, importo_progetti_nuovi, pct_in_essere]
        primary_key: []
        min_rows: 1

validation:
  fail_on_error: true
